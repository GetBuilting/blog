{% extends "base.html" %}
{% block title %}注册 - {{ site_name }}{% endblock %}

{% block content %}
<div class="container-sm py-6">
    <div class="Box">
        <div class="Box-header">
            <h2 class="Box-title">📝 注册</h2>
        </div>
        <div class="Box-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" id="username" name="username" class="form-control"
                           required minlength="2" autofocus>
                    <p class="note">至少 2 个字符</p>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" id="password" name="password" class="form-control"
                           required minlength="6">
                    <p class="note">至少 6 个字符</p>
                </div>
                <div class="form-group">
                    <label for="password2" class="form-label">确认密码</label>
                    <input type="password" id="password2" name="password2" class="form-control"
                           required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
        </div>
        <div class="Box-footer text-center">
            <p class="color-fg-muted">已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
